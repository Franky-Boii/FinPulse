version: 2

models:

  - name: stg_customers
    description: "Cleaned customer records from the raw OLTP layer."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - not_null
          - unique

      - name: email
        description: "Normalised customer email address."
        data_tests:
          - not_null

      - name: country
        description: "Customer country."
        data_tests:
          - not_null

  - name: stg_products
    description: "Cleaned product records."
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null

  - name: stg_orders
    description: "Cleaned customer orders."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: order_date
        data_tests:
          - not_null

      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              values:
                - cancelled
                - paid
                - placed
                - shipped

  - name: stg_order_items
    description: "Cleaned order line items."
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

      - name: quantity
        data_tests:
          - not_null

  - name: stg_payments
    description: "Cleaned payment transactions."
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: amount
        data_tests:
          - not_null

      - name: payment_status
        data_tests:
          - not_null
          - accepted_values:
              values:
                - failed
                - pending
                - success

      - name: payment_method
        data_tests:
          - not_null
          - accepted_values:
              values:
                - card
                - eft
                - wallet
