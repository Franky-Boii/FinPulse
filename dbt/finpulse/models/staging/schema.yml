version: 2

models:

  - name: stg_customers
    description: "Cleaned customer records from the raw OLTP layer."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - not_null
          - unique

      - name: email
        description: "Normalised customer email address."
        tests:
          - not_null

      - name: country
        description: "Customer country."
        tests:
          - not_null


  - name: stg_products
    description: "Cleaned product records."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

      - name: product_name
        tests:
          - not_null

      - name: unit_price
        tests:
          - not_null


  - name: stg_orders
    description: "Cleaned customer orders."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: order_date
        tests:
          - not_null


  - name: stg_order_items
    description: "Cleaned order line items."
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: quantity
        tests:
          - not_null


  - name: stg_payments
    description: "Cleaned payment transactions."
    columns:
      - name: payment_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: amount
        tests:
          - not_null
