version: 2

sources:
  - name: raw
    description: "Raw OLTP data extracted from the FinPulse PostgreSQL source database."

    schema: raw

    tables:
      - name: customers
        description: "Customer records extracted from the OLTP database."

      - name: products
        description: "Product records extracted from the OLTP database."

      - name: orders
        description: "Customer order records extracted from the OLTP database."

      - name: order_items
        description: "Individual product line items belonging to orders."

      - name: payments
        description: "Payment transactions associated with orders."
